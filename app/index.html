<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kartikeswar Committee</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#7b1e22">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Kartikeswar">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Noto+Sans+Oriya:wght@400;600;700&family=Yeseva+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
</head>

<body>
    <div id="app">
        <div class="center-screen">
            <div class="diya" aria-hidden="true"></div>
            <p class="muted">Loading…</p>
        </div>
    </div>
    <div id="sheet-root"></div>
    <div id="toast" role="status" aria-live="polite"></div>

    <script>
        // If the app cannot start (old cached files, a blocked download), show why instead of "Loading…" forever
        (function () {
            var errors = [];
            window.addEventListener("error", function (e) {
                errors.push(e.message || (e.target && (e.target.src || e.target.href)) || "error");
            }, true);
            window.addEventListener("unhandledrejection", function (e) {
                errors.push(String(e.reason && e.reason.message || e.reason));
            });
            // Clears cached app files and the offline copy of the data (not the login), then reloads
            window.kpReset = function () {
                var jobs = [];
                if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
                    return Promise.all(regs.map(function (r) { return r.unregister(); }));
                }));
                if (window.caches) jobs.push(caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                }));
                if (indexedDB.databases) jobs.push(indexedDB.databases().then(function (dbs) {
                    dbs.forEach(function (d) { if (/^firestore/.test(d.name)) indexedDB.deleteDatabase(d.name); });
                }));
                var done = function () { location.reload(); };
                Promise.all(jobs).then(function () { setTimeout(done, 500); }, done);
                setTimeout(done, 3000);
            };
            setTimeout(function () {
                if (window.__appStarted) return;
                var msg = errors.join(" · ").replace(/[<>&]/g, "") || "No response. Check the internet. / ଇଣ୍ଟରନେଟ୍ ଦେଖନ୍ତୁ।";
                document.getElementById("app").innerHTML =
                    '<div class="center-screen"><div class="diya"></div><h1>App could not start / ଆପ୍ ଖୋଲିଲା ନାହିଁ</h1>' +
                    '<p class="muted small">' + msg + '</p>' +
                    '<button class="btn primary" onclick="location.reload()">Reload / ପୁଣି ଖୋଲନ୍ତୁ</button> ' +
                    '<button class="btn" onclick="kpReset()">Clear saved data &amp; reload</button></div>';
            }, 15000);
        })();
    </script>

    <!-- Past years' public data, used to import old donors and last year's balance -->
    <script src="../data.js"></script>
    <script src="vendor/qrcode.js"></script>
    <script type="module" src="app.js"></script>
</body>

</html>
